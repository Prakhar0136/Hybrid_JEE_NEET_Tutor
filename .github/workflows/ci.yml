name: CI Pipeline

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Backend Validation (Node.js syntax, dependency check & tests)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax & import integrity
        run: node -c server.js

  # ---------------------------------------------------------------------------
  # Frontend Validation (TypeScript checks & Next.js production build)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: https://api-placeholder.onrender.com
        run: npm run build

